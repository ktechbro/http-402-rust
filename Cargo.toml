[package]
name = "http-402-rust"
version = "0.1.0"
edition = "2024"
description = "Tutorial 1: learn HTTP 402 with a local simulated payment lifecycle"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
